name: One-shot fix TRIAD and BOLT separation

on:
  push:
    paths:
      - '.github/workflows/_one_shot_fix_triad_bolt.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix TRIAD/BOLT metadata and URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          triad_url='https://comicman081-collab.github.io/TRIAD-RUN/TRIAD_RUN_V0_8_MANEQUIN_ASSEMBLY.html'
          bolt_url='https://bolt-bloom-tunnel-quest.comicman081.chatgpt.site'

          p=Path('jh-project-archive/index.html')
          s=p.read_text(encoding='utf-8')

          # Canonical TRIAD card: deck-building card game, direct runnable HTML.
          import re
          s=re.sub(
            r"\{id:'triad-run'.*?\},\n",
            "{id:'triad-run',title:'TRIAD RUN',type:'game',label:'GAME',status:'WEB',cls:'rel',ver:'V0.8',sub:'Deck-building Card Game',desc:'3인 로스터와 시작 덱을 구성하고 손패의 행동 카드를 선택해 스테이지를 공략하는 덱빌딩 카드 게임.',img:TH['triad-run'],url:'"+triad_url+"',note:'GitHub README 기준 Deck building game. 실제 실행 파일 TRIAD_RUN_V0_8_MANEQUIN_ASSEMBLY.html을 GitHub Pages에서 직접 엽니다.'},\n",
            s, count=1
          )

          # Canonical BOLT & BLOOM card: completely separate run-and-gun game.
          s=re.sub(
            r"\{id:'bolt-bloom'.*?\},\n",
            "{id:'bolt-bloom',title:'BOLT & BLOOM: TUNNEL QUEST',type:'game',label:'GAME',status:'WEB',cls:'rel',ver:'25 Stages',sub:'2D Run-and-Gun Shooter',desc:'BOLT와 BLOOM을 선택해 광산 터널을 달리고 점프·사격으로 적을 돌파하는 별도 2D 런앤건 슈팅 게임.',img:TH['bolt-bloom'],url:'"+bolt_url+"',note:'TRIAD RUN과 완전히 별도 프로젝트. standalone 공개 빌드.'},\n",
            s, count=1
          )
          p.write_text(s,encoding='utf-8')

          # Update the later TRIAD runtime override so it cannot put the old root URL back.
          tp=Path('jh-project-archive/thumbs/triad-run.js')
          t=tp.read_text(encoding='utf-8')
          t=t.replace("ver:'V0.8 · 30 Stages',sub:'Tactical Deck-building Card RPG'","ver:'V0.8',sub:'Deck-building Card Game'")
          t=t.replace("desc:'캐릭터 3인 로스터와 시작 덱을 구성하고, 전투에서 손패의 행동 카드를 선택해 30스테이지 런을 진행하는 전술 덱빌딩 카드 RPG.'","desc:'3인 로스터와 시작 덱을 구성하고 손패의 행동 카드를 선택해 스테이지를 공략하는 덱빌딩 카드 게임.'")
          t=t.replace("url:'https://comicman081-collab.github.io/TRIAD-RUN/'","url:'"+triad_url+"'")
          t=t.replace("note:'GitHub canonical runtime TRIAD_RUN_V0_8_MANEQUIN_ASSEMBLY.html. 126장 카드, 30스테이지·3막·보스 10/20/30 구성의 Deck Building RPG.'","note:'GitHub README 기준 Deck building game. 실제 실행 파일 TRIAD_RUN_V0_8_MANEQUIN_ASSEMBLY.html을 GitHub Pages에서 직접 엽니다.'")
          tp.write_text(t,encoding='utf-8')

          # Keep BOLT override explicitly independent.
          bp=Path('jh-project-archive/thumbs/bolt-bloom.js')
          b=bp.read_text(encoding='utf-8')
          b=b.replace("title:'BOLT & BLOOM'","title:'BOLT & BLOOM: TUNNEL QUEST'")
          b=b.replace("note:'TRIAD RUN과 별도 프로젝트. 현재 standalone 빌드는 PLAYABLE STAGES 01—25를 제공하며 공개 플레이 주소는 chatgpt.site.'","note:'TRIAD RUN과 완전히 별도 프로젝트. standalone 공개 빌드는 PLAYABLE STAGES 01—25를 제공합니다.'")
          bp.write_text(b,encoding='utf-8')

          # Assert separation.
          final=p.read_text(encoding='utf-8')
          assert "sub:'Deck-building Card Game'" in final
          assert triad_url in final
          assert "BOLT & BLOOM: TUNNEL QUEST" in final
          assert bolt_url in final
          assert "Run-and-Gun Shooter'" in final
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jh-project-archive/index.html jh-project-archive/thumbs/triad-run.js jh-project-archive/thumbs/bolt-bloom.js
          git commit -m 'portfolio: separate TRIAD deckbuilder from BOLT run-and-gun [skip actions]'
          git push origin HEAD:main
