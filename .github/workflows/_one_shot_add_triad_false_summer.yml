name: One-shot add TRIAD RUN and FALSE SUMMER portfolio links

on:
  push:
    paths:
      - '.github/workflows/_one_shot_add_triad_false_summer.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update project metadata and live links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jh-project-archive/index.html')
          text=p.read_text(encoding='utf-8')
          old="{id:'false-summer',title:'FALSE SUMMER',type:'game',label:'GAME',status:'WIP',cls:'wip',ver:'Current Build',sub:'Visual Novel',desc:'기억과 선택을 따라가는 비주얼 노벨 프로젝트.',thumb:'t-false',url:'https://comicman081.itch.io/false-summer-teen15-test',note:'외부 호스트 정책에 따라 iframe 실행이 제한될 수 있습니다.'}"
          new="{id:'false-summer',title:'FALSE SUMMER',type:'game',label:'GAME',status:'ITCH.IO',cls:'rel',ver:'Teen 15 Test',sub:'Mystery Romance Visual Novel',desc:'추리와 연애 요소를 중심으로 기억·진실·선택을 따라가는 비주얼 노벨. itch.io 공개 테스트 빌드를 포트폴리오에서 바로 확인합니다.',thumb:'t-false',url:'https://comicman081.itch.io/false-summer-teen15-test',note:'itch.io 공개 테스트 페이지 연결. iframe 정책으로 내부 표시가 제한될 수 있습니다.'}"
          if old not in text: raise SystemExit('FALSE SUMMER anchor missing')
          text=text.replace(old,new,1)
          old="{id:'triad-run',title:'TRIAD RUN',type:'game',label:'GAME',status:'WIP',cls:'wip',ver:'Development',sub:'Combat Project',desc:'모바일 전투와 HUD, 캐릭터·몬스터 액션을 개선 중인 게임 프로젝트.',thumb:'t-triad',url:'',note:'공개 Web build 미연결.'}"
          new="{id:'triad-run',title:'TRIAD RUN',type:'game',label:'GAME',status:'WEB',cls:'rel',ver:'GitHub Pages',sub:'Run-and-Gun Shooter',desc:'빠른 이동과 사격을 중심으로 플레이하는 런앤건 슈팅 게임. GitHub Pages의 실제 웹 빌드를 포트폴리오에서 바로 실행합니다.',thumb:'t-triad',url:'https://comicman081-collab.github.io/TRIAD-RUN/',note:'GitHub 저장소 comicman081-collab/TRIAD-RUN의 공개 Pages 빌드 연결.'}"
          if old not in text: raise SystemExit('TRIAD RUN anchor missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit portfolio project links
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jh-project-archive/index.html
          git commit -m 'portfolio: connect TRIAD RUN and FALSE SUMMER builds [skip actions]'
          git push origin HEAD:main
